# Formatting and checks, as in the salt-extension copier template.
# Install with: pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: debug-statements

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.20.0
    hooks:
      - id: pyupgrade
        args: [--py311-plus]
        exclude: src/saltext/noderings/version.py

  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort
        args: [--py, "311"]
        exclude: src/saltext/noderings/(__init__|version).py

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        args: [-l, "100"]
        exclude: src/saltext/noderings/version.py

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [--silent, -lll, --skip, B701]
        exclude: ^tests/
