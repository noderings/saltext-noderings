name: CI

# Runs on GitHub-hosted runners until a NodeRings self-hosted runner exists.
# To switch, register a runner with the labels "self-hosted" and "noderings"
# (see .github/self-hosted-runner.md) and set the repository variable
# NODERINGS_RUNNER=true. Pull requests from forks always stay on
# GitHub-hosted runners: never run untrusted code on our own machines.
"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      billed:
        description: Also run tests that order billed servers
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ${{ (vars.NODERINGS_RUNNER == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","noderings"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install pre-commit nox uv
      - name: Run all hooks (format, docs stubs, bandit, pylint, actionlint)
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  unit:
    name: Unit (Salt ${{ matrix.salt }}, Python ${{ matrix.python }})
    runs-on: ${{ (vars.NODERINGS_RUNNER == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","noderings"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {salt: "3006", python: "3.11"}
          - {salt: "3007", python: "3.12"}
          - {salt: "3008", python: "3.12"}
          - {salt: "3008", python: "3.13"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install nox uv
      - name: Unit tests (nox session from the copier template)
        env:
          SALT_REQUIREMENT: salt~=${{ matrix.salt }}.0
        run: nox -e "tests-${{ matrix.python }}" -- tests/unit

  docs:
    name: Docs
    runs-on: ${{ (vars.NODERINGS_RUNNER == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","noderings"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check system packages (make, enchant for the spelling extension)
        run: |
          missing=()
          command -v make >/dev/null || missing+=(make)
          ldconfig -p | grep -q libenchant-2 || missing+=(libenchant-2-2)
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq "${missing[@]}"
          fi
      - run: python -m pip install nox uv
      - name: Build the docs (linkcheck, coverage, HTML; warnings fail)
        run: nox -e docs

  package:
    name: Package
    runs-on: ${{ (vars.NODERINGS_RUNNER == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","noderings"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the wheel and check that Salt loads the extension
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install -q dist/*.whl
          /tmp/wheel-venv/bin/python - <<'PY'
          from importlib.metadata import entry_points
          eps = [ep for ep in entry_points(group="salt.loader") if ep.name == "saltext.noderings"]
          assert eps and eps[0].value == "saltext.noderings", eps
          import saltext.noderings.clouds.noderings_mod
          import saltext.noderings.modules.noderings_mod
          import saltext.noderings.states.noderings_mod
          print("entry point and modules OK")
          PY
          mkdir -p /tmp/salt-root
          printf 'root_dir: /tmp/salt-root\nfile_client: local\nuser: %s\n' "$(id -un)" > /tmp/salt-root/minion
          /tmp/wheel-venv/bin/salt-call -c /tmp/salt-root --local --out=json sys.list_functions noderings | grep -q '"noderings.list_regions"'
          /tmp/wheel-venv/bin/salt-call -c /tmp/salt-root --local --out=json sys.list_state_functions noderings | grep -q '"noderings.vm_present"'

  live:
    name: Live tests (NodeRings API)
    needs: [unit]
    # Only where the secret exists; forks and outside pull requests skip.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.NODERINGS_RUNNER == 'true' && fromJSON('["self-hosted","noderings"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      NODERINGS_TOKEN: ${{ secrets.NODERINGS_TOKEN }}
      NODERINGS_TEST_BILLED: ${{ inputs.billed && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install "salt~=3008.0" -e ".[tests]"
      - name: Functional and integration tests
        if: env.NODERINGS_TOKEN != ''
        run: pytest -ra tests/functional tests/integration
      - name: Note the skip
        if: env.NODERINGS_TOKEN == ''
        run: echo "::notice title=Live tests skipped::Add the repository secret NODERINGS_TOKEN (a service account token for a test organization) to run them."

  result:
    name: CI result
    # The one required status check: it fails if any job above failed.
    if: always()
    needs: [pre-commit, unit, docs, package, live]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
